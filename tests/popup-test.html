<!doctype html>
<!-- Aperçu du popup hors extension, avec un faux « chrome » (à ouvrir via un serveur local). -->
<meta charset="utf-8">
<script>
  fetch('../popup.html').then((r) => r.text()).then((html) => {
    const faux = () => {
      const d = {};
      const evenement = { addListener() {} };
      window.chrome = {
        storage: { sync: { get: async (x) => ({ ...x, ...d }), set: async (o) => { Object.assign(d, o); } } },
        tabs: {
          query: async () => [{ id: 1 }],
          connect: () => ({
            disconnect() {},
            onDisconnect: evenement,
            onMessage: { addListener: (f) => setTimeout(f, 50, { cadre: 'a', converties: 12 }) }
          }),
          onUpdated: evenement
        },
        runtime: { openOptionsPage() {} }
      };
    };
    html = html
      .replace(/(href|src)="(?!#|http)/g, '$1="../')
      .replace('<head>', '<head><script>(' + faux + ')()<\/script>');
    document.open();
    document.write(html);
    document.close();
  });
</script>
