<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pronote sur 20 : sites</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>Sites et ENT</h1>
    <p class="intro">Ajoutez l'adresse de votre ENT si Pronote ne s'ouvre pas sur index-education.net.</p>

    <form class="ajout" id="formulaire" novalidate>
      <input class="champ" id="adresse" type="text" inputmode="url" autocomplete="off" spellcheck="false"
             placeholder="ent.monlycee.fr" aria-label="Adresse du site" aria-describedby="message">
      <button class="bouton bouton-fort" type="submit">Ajouter</button>
    </form>
    <p class="message" id="message" role="status"></p>

    <ul class="sites" id="sites"></ul>
  </main>

  <script src="core.js"></script>
  <script src="options.js"></script>
</body>
</html>
