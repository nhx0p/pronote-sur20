<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Pronote sur 20</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="tete">
    <h1>Pronote sur 20</h1>
    <label class="inter">
      <input type="checkbox" id="actif" role="switch" aria-label="Convertir les notes">
      <span class="inter-piste"></span>
    </label>
  </header>

  <div class="etat" id="etat" role="status">
    <span class="point"></span>
    <span class="etat-texte" id="etatTexte"></span>
    <button class="bouton bouton-petit" id="etatAction" type="button" hidden></button>
  </div>

  <main id="reglages">
    <div class="ligne">
      <span id="libMode">Note sur 20</span>
      <div class="segments" role="radiogroup" aria-labelledby="libMode">
        <label><input type="radio" name="mode" value="remplacer"><span>Remplace</span></label>
        <label><input type="radio" name="mode" value="cote"><span>À côté</span></label>
      </div>
    </div>

    <div class="ligne">
      <span id="libDecimales">Décimales</span>
      <div class="segments" role="radiogroup" aria-labelledby="libDecimales">
        <label><input type="radio" name="decimales" value="1"><span>1</span></label>
        <label><input type="radio" name="decimales" value="2"><span>2</span></label>
      </div>
    </div>
  </main>

  <footer class="pied">
    <button class="lien" id="lienOptions" type="button">Sites et ENT</button>
  </footer>

  <script src="core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
